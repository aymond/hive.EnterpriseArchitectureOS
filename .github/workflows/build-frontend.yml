name: Build and Push Frontend to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'frontend/**'
      - '.github/workflows/build-frontend.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Downcase Image Names
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "FRONTEND_IMAGE=${{ env.REGISTRY }}/$REPO_LOWER-frontend" >> $GITHUB_ENV

      - name: Build and push Frontend image (Arch-specific)
        uses: docker/build-push-action@v5
        env:
          NEXT_TELEMETRY_DISABLED: 1
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest-${{ matrix.arch }}
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    if: github.event_name != 'pull_request'
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Downcase Image Names
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "FRONTEND_IMAGE=${{ env.REGISTRY }}/$REPO_LOWER-frontend" >> $GITHUB_ENV

      - name: Create and push Frontend multi-arch manifest
        run: |
          docker pull ${{ env.FRONTEND_IMAGE }}:latest-amd64
          docker pull ${{ env.FRONTEND_IMAGE }}:latest-arm64
          docker manifest create ${{ env.FRONTEND_IMAGE }}:latest \
            ${{ env.FRONTEND_IMAGE }}:latest-amd64 \
            ${{ env.FRONTEND_IMAGE }}:latest-arm64
          docker manifest push ${{ env.FRONTEND_IMAGE }}:latest
